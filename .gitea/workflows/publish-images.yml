name: Publish container images

# Builds the API and worker images and pushes them to the Gitea container
# registry.
#
# Why this file exists alongside .github/workflows/publish-images.yml:
# Gitea resolves workflows from the FIRST directory that exists, checking
# .gitea/workflows before .github/workflows (see listWorkflowsInDirs in
# modules/actions/workflows.go — it breaks on the first hit). Because this
# directory exists, Gitea ignores .github/workflows entirely. That file stays
# GitHub's concern and keeps publishing public images to GHCR from the mirror,
# so the two pipelines never collide or double-build.
#
# The registry host is deliberately gitea.strant.casa, not .com: the runner
# sits inside the homelab where .casa resolves. Do not "correct" it.
#
# No buildx GHA cache here — the Gitea runner does not reliably expose the
# Actions cache backend that `type=gha` needs, and a missing cache backend
# fails the build rather than degrading gracefully.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: gitea.strant.casa
  IMAGE_PREFIX: m365copilot-usage-reporter

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Gitea container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITEA_TOKEN is injected automatically and scoped to this repo. If a
          # package push returns 403, add a REGISTRY_TOKEN repo secret holding a
          # PAT with write:package — it is preferred when present.
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITEA_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.target }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
