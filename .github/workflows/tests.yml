name: Tests

# Runs the checks that would otherwise only ever run on someone's laptop.
#
# Deliberately three steps and no linter. ruff reports well over a hundred
# pre-existing findings across this suite, and a gate that is red on the day it
# lands is a gate people learn to ignore.
#
# The tsc step is the one that earns its place: `npm run build` is only
# `vite build`, which strips TypeScript types without checking them, so a type
# error builds perfectly happily and ships.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # No database service needed: tests/conftest.py forces SQLite into a temp
      # file and disables the startup migration.
      - name: Install
        run: pip install -e ".[dev]"

      - name: pytest
        run: pytest -q

  frontend:
    name: types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
